<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guia Lapa – Bom Jesus da Lapa</title>
<meta name="description" content="Comércios, serviços e turismo de Bom Jesus da Lapa-BA, com mapa e avisos da cidade.">
<meta name="theme-color" content="#0B2D6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guia Lapa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="marca/icone_app.png">
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --azul:#0B2D6B; --azul-ceu:#2980EB; --laranja:#F57C00; --amarelo:#FFC107;
    --fundo:#F5F5F5; --painel:#ffffff; --texto:#1b2430; --suave:#5b6573; --borda:#e3e7ee; --campo:#f1f3f6;
    --sombra:0 -6px 24px rgba(11,45,107,.18);
  }
  html[data-tema="escuro"]{
    --fundo:#0e1116; --painel:#171c23; --texto:#eef1f5; --suave:#a9b3c0; --borda:#2a313b; --campo:#222934;
    --sombra:0 -6px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:16px;line-height:1.4;overflow:hidden}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--azul-ceu);outline-offset:2px}

  /* Topo */
  header{flex:0 0 auto;background:var(--azul);color:#fff;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:1200}
  header img{height:38px;display:block}
  header .lema{font-size:13px;opacity:.9;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibtn{flex:0 0 auto;width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ibtn:hover{background:rgba(255,255,255,.24)}

  /* Estrutura */
  #app{flex:1;min-height:0;position:relative;display:flex}
  #mapa{position:absolute;inset:0;background:#cfd8e3;z-index:1}
  #painel{position:absolute;left:0;right:0;bottom:0;height:86%;background:var(--painel);border-radius:22px 22px 0 0;box-shadow:var(--sombra);z-index:1100;display:flex;flex-direction:column;transition:transform .28s ease;transform:translateY(calc(100% - 152px))}
  #painel[data-estado="meio"]{transform:translateY(46%)}
  #painel[data-estado="alto"]{transform:translateY(0)}
  #alca{flex:0 0 auto;touch-action:none;cursor:grab;padding:8px 16px 2px;text-align:center;user-select:none}
  #alca i{display:block;width:44px;height:5px;border-radius:3px;background:var(--borda);margin:0 auto 6px}
  #alca span{font-size:13px;color:var(--suave);font-weight:600}
  .topo{flex:0 0 auto;padding:4px 14px 6px}
  .busca{width:100%;padding:13px 16px;font-size:16px;border:1px solid var(--borda);border-radius:14px;background:var(--campo);color:var(--texto)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--borda);background:var(--painel);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
  html[data-tema="escuro"] .chip.on{background:var(--azul-ceu);border-color:var(--azul-ceu)}
  #rolagem{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 30px;-webkit-overflow-scrolling:touch}
  #painel[data-estado="baixo"] #rolagem{overflow:hidden}

  @media (min-width:900px){
    header img{height:42px}
    #app{flex-direction:row}
    #painel{position:relative;order:0;flex:0 0 clamp(320px,20vw,400px);height:auto;border-radius:0;transform:none!important;box-shadow:none;border-right:1px solid var(--borda)}
    #mapa{position:relative;inset:auto;flex:1;order:1}
    #alca{display:none}
    .topo{padding-top:14px}
    #rolagem{overflow-y:auto!important}
  }

  /* Cartões */
  .aviso{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--campo);border:none;border-left:5px solid var(--cor,var(--azul-ceu));border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer}
  .aviso .ic{font-size:22px;line-height:1.1}
  .aviso b{display:block}
  .aviso small{color:var(--suave)}
  .anuncio{margin:10px 0;border-radius:16px;overflow:hidden;position:relative;background:var(--campo);border:1px solid var(--borda)}
  .anuncio a,.anuncio div.ad{display:block}
  .anuncio img{width:100%;display:block;aspect-ratio:2/1;object-fit:cover}
  @media (min-width:900px){ .anuncio img{aspect-ratio:3/2} }
  .anuncio .rotulo{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.3px}
  .convite{margin:10px 0;padding:14px;border-radius:16px;background:var(--campo);border:1px dashed var(--borda);font-size:15px}
  .convite a{color:var(--azul-ceu);font-weight:700}
  .cartao{display:flex;gap:12px;width:100%;text-align:left;background:var(--painel);border:1px solid var(--borda);border-radius:18px;padding:12px;margin:0 0 10px;cursor:pointer}
  .cartao:hover{border-color:var(--azul-ceu)}
  .foto{width:78px;height:78px;border-radius:14px;background:var(--azul-ceu);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover}
  .cartao h3{margin:0 0 2px;font-size:17px}
  .cartao p{margin:0;color:var(--suave);font-size:14px}
  .cartao .info{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:13.5px;color:var(--suave)}
  .tag{display:inline-block;font-size:12px;font-weight:800;color:var(--laranja);margin-bottom:2px;letter-spacing:.2px}
  .vazio{padding:28px 10px;text-align:center;color:var(--suave)}

  /* Detalhe */
  .voltar{align-self:flex-start;background:none;border:none;color:var(--azul-ceu);font-weight:700;font-size:16px;cursor:pointer;padding:8px 0}
  .capa-wrap{flex:1 1 auto;min-height:200px;max-height:46vh;display:flex;align-items:center;justify-content:center;background:var(--campo);border-radius:16px;overflow:hidden;margin:4px 0 8px}
  .capa{max-width:100%;max-height:100%;object-fit:contain;display:block}
  #detalhe:not([hidden]){display:flex;flex-direction:column;min-height:100%}
  .det{display:flex;flex-direction:column;flex:1 1 auto;min-height:100%}
  .det h2{margin:4px 0 2px;font-size:23px}
  .linha{display:flex;gap:10px;margin:8px 0;color:var(--texto)}
  .linha .ic{flex:0 0 24px;text-align:center}
  .linha span.s{color:var(--suave)}
  .destaque{background:var(--campo);border-radius:14px;padding:10px 12px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:14px}
  .btn{flex:1 1 130px;text-align:center;text-decoration:none;padding:13px 10px;border-radius:14px;font-weight:700;font-size:16px;border:2px solid var(--azul);background:var(--azul);color:#fff;cursor:pointer}
  .btn.sec{background:transparent;color:var(--azul)}
  html[data-tema="escuro"] .btn{background:var(--azul-ceu);border-color:var(--azul-ceu)}
  html[data-tema="escuro"] .btn.sec{background:transparent;color:var(--azul-ceu)}

  .instalar{margin-top:18px;padding:14px;border-radius:16px;background:var(--campo);font-size:14.5px;color:var(--suave)}
  .instalar h4{margin:0 0 6px;color:var(--texto);font-size:16px}
  .rodape{text-align:center;font-size:13px;color:var(--suave);padding:16px 0 4px}
  .rodape a{color:var(--azul-ceu)}

  /* Marcadores */
  .pin{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:17px;background:var(--azul);color:#fff;transition:transform .15s}
  .pin.pat{background:var(--laranja)}
  .pin.sel{transform:scale(1.35);box-shadow:0 0 0 4px rgba(41,128,235,.45),0 2px 8px rgba(0,0,0,.45)}
  .pin.av{background:var(--cor,#2980EB)}
  .eu{width:18px;height:18px;border-radius:50%;background:#2980EB;border:3px solid #fff;box-shadow:0 0 0 6px rgba(41,128,235,.3)}
  html[data-tema="escuro"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
  .leaflet-control-attribution{font-size:10px}
  @media (max-width:899px){ .leaflet-bottom{ bottom:152px } }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<style id="visual-misto">
  :root{
    --fundo:#FBF8F2; --painel:#FFFFFF; --texto:#1B2430; --suave:#4F5A68; --borda:#E8E2D6; --campo:#F4EFE5;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --raio:18px;
  }
  html[data-tema="escuro"]{
    --fundo:#0C1018; --painel:rgba(22,28,38,.86); --texto:#EEF1F5; --suave:#B3BDCB; --borda:#2B3442; --campo:#1C2430;
  }
  body{background:var(--fundo)}
  header{background:linear-gradient(120deg,#0B2D6B,#14428F);box-shadow:0 2px 12px rgba(11,45,107,.25)}
  header .lema{font-family:var(--serif);font-style:italic;font-size:14px;opacity:.95}
  #painel{background:var(--painel)}
  html[data-tema="escuro"] #painel{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  @media (min-width:900px){ #painel{border-right:1px solid var(--borda)} }

  /* títulos em serifa, dando cara de guia */
  .cartao h3,.det h2,.aviso b{font-family:var(--serif);letter-spacing:.1px}
  .det h2{font-size:26px;line-height:1.15}
  .cartao h3{font-size:18px}
  .tag{font-family:system-ui,sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.6px;color:#B45309}
  html[data-tema="escuro"] .tag{color:#FFB35C}

  /* cartões: foto em destaque, cor por categoria */
  .cartao{border-radius:var(--raio);border:1px solid var(--borda);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s,border-color .15s}
  .cartao:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(11,45,107,.10)}
  .cartao .foto{width:84px;height:84px;background:var(--cat,#2980EB);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
  .cartao .foto img{border-radius:0}
  .cartao{border-left:5px solid var(--cat,#2980EB)}

  /* chips com cor por categoria */
  .chip{border-radius:999px;font-weight:700}
  .chip.on{background:var(--azul);border-color:var(--azul)}
  html[data-tema="escuro"] .chip.on{background:var(--azul-ceu);border-color:var(--azul-ceu)}

  /* avisos e anúncios mais limpos */
  .aviso{border-radius:var(--raio)}
  .anuncio{border-radius:var(--raio);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .convite{border-radius:var(--raio)}

  /* pinos coloridos por categoria, com contorno que aparece no escuro */
  .pin{background:var(--cat,#0B2D6B);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);width:38px;height:38px;font-size:18px}
  .pin.pat{outline:3px solid #FFC107;outline-offset:2px}
  .leaflet-marker-icon.pin-wrap{background:none}

  /* botões com cantos mais suaves e foco visível */
  .btn{border-radius:14px;box-shadow:0 2px 6px rgba(11,45,107,.18)}
  .btn:focus-visible,.chip:focus-visible,.cartao:focus-visible{outline:3px solid #2980EB;outline-offset:2px}
  .instalar{border-radius:var(--raio)}
  @media (prefers-reduced-motion: reduce){ .cartao{transition:none} }
</style>
</head>
<body>
<header>
  <img src="marca/logo_nome.png" alt="Guia Lapa">
  <div class="lema">Explore, conheça, viva a nossa Lapa!</div>
  <button class="ibtn" id="btn-perto" title="Perto de mim" aria-label="Mostrar locais perto de mim">📍</button>
  <button class="ibtn" id="btn-tema" title="Tema claro ou escuro" aria-label="Alternar tema claro ou escuro">🌙</button>
</header>

<div id="app">
  <aside id="painel" data-estado="baixo" aria-label="Lista de locais">
    <div id="alca" role="button" tabindex="0" aria-label="Abrir ou fechar a lista"><i></i><span id="contagem">Locais</span></div>
    <div class="topo">
      <input id="busca" class="busca" type="search" placeholder="Buscar comércio ou serviço" aria-label="Buscar" autocomplete="off">
      <nav id="chips" class="chips" aria-label="Categorias"></nav>
    </div>
    <div id="rolagem">
      <div id="avisos"></div>
      <div id="anuncio"></div>
      <div id="lista" aria-live="polite"><div class="vazio">Carregando locais…</div></div>
      <div id="detalhe" hidden></div>
      <section class="instalar">
        <h4>Use no celular</h4>
        <div><b>Android:</b> baixe o aplicativo. Ele funciona sem internet e permite cadastrar locais e avaliar.</div>
        <div style="margin-top:6px"><b>iPhone:</b> no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</div>
        <div class="btns" id="botoes-app"></div>
      </section>
      <div class="rodape">Guia Lapa · <a href="politica-de-privacidade.html">Política de privacidade</a></div>
    </div>
  </aside>
  <div id="mapa" role="region" aria-label="Mapa da cidade"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  const CFG = window.GUIA_CONFIG || {};
  const CATEGORIAS = {hotel:'Hotel',pousada:'Pousada',restaurante:'Restaurante',hamburgueria:'Hamburgueria',lanchonete:'Lanchonete',padaria:'Padaria',mercado:'Mercado',farmacia:'Farmácia',posto:'Posto',banco:'Banco',religioso:'Religioso',turismo:'Turismo',transporte:'Transporte',servicos:'Serviços',outros:'Outros'};
  const COR = {hotel:'#7B3FC4',pousada:'#7B3FC4',restaurante:'#D9480F',hamburgueria:'#D9480F',lanchonete:'#E8710A',padaria:'#B8860B',mercado:'#2B8A3E',farmacia:'#0CA678',posto:'#495057',banco:'#1C7ED6',religioso:'#6741D9',turismo:'#0B7285',transporte:'#1864AB',servicos:'#5C7CFA',outros:'#2980EB'};
  const ICONES = {hotel:'🏨',pousada:'🏡',restaurante:'🍽️',hamburgueria:'🍔',lanchonete:'🥪',padaria:'🥖',mercado:'🛒',farmacia:'💊',posto:'⛽',banco:'🏦',religioso:'⛪',turismo:'🗺️',transporte:'🚌',servicos:'🛠️',outros:'📍'};
  const TIPOS = {aviso:['📢','Aviso','#1E6FD9'],rua_fechada:['⛔','Rua fechada','#D93025'],procissao:['⛪','Procissão','#7B3FC4'],evento:['🎉','Evento','#1E9E5B'],obra:['🚧','Obra','#E8710A'],transito:['🚦','Trânsito','#B8860B']};

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const urlSegura = u => (typeof u === 'string' && /^https:\/\//i.test(u)) ? u : '';
  const digitos = s => String(s || '').replace(/\D/g, '');
  const comPais = d => d.startsWith('55') ? d : '55' + d;
  const ehDesktop = () => window.matchMedia('(min-width:900px)').matches;
  const patrocinado = h => !!h.destaque_ate && new Date(h.destaque_ate).getTime() > Date.now();
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
  const ler = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };

  let locais = [], extras = {avisos:[], anuncios:[], config:{}};
  let filtro = 'todas', termo = '', selecionado = null, posicao = null;
  let mapa, camadaAvisos, camadaPins, pinsPorId = {}, marcadorEu = null;
  let anuncioIdx = 0, anuncioTimer = null; const anunciosVistos = new Set();

  // ---------- Tema ----------
  function aplicarTema(t){
    document.documentElement.setAttribute('data-tema', t);
    $('btn-tema').textContent = t === 'escuro' ? '☀️' : '🌙';
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', t === 'escuro' ? '#0e1116' : '#0B2D6B');
  }
  aplicarTema(ler('tema') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'));
  $('btn-tema').addEventListener('click', () => {
    const novo = document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro';
    aplicarTema(novo); guardar('tema', novo);
  });

  // ---------- Rede ----------
  async function rpc(nome, corpo){
    const r = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + nome, {
      method:'POST', keepalive:true,
      headers:{apikey:CFG.supabaseKey, Authorization:'Bearer ' + CFG.supabaseKey, 'Content-Type':'application/json'},
      body: JSON.stringify(corpo || {})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // ---------- Painel (celular) ----------
  const painel = $('painel');
  const ESTADOS = ['baixo','meio','alto'];
  function estado(e){
    painel.dataset.estado = e;
    setTimeout(() => mapa && mapa.invalidateSize(), 320);
  }
  function subir(){ const i = ESTADOS.indexOf(painel.dataset.estado); estado(ESTADOS[Math.min(2, i + 1)]); }
  function descer(){ const i = ESTADOS.indexOf(painel.dataset.estado); estado(ESTADOS[Math.max(0, i - 1)]); }
  (function arrastar(){
    const alca = $('alca'); let y0 = null;
    alca.addEventListener('pointerdown', e => { y0 = e.clientY; alca.setPointerCapture(e.pointerId); });
    alca.addEventListener('pointerup', e => {
      if (y0 == null) return;
      const dy = e.clientY - y0; y0 = null;
      if (Math.abs(dy) < 10){ // toque: alterna
        const e0 = painel.dataset.estado; estado(e0 === 'baixo' ? 'meio' : (e0 === 'meio' ? 'alto' : 'baixo'));
      } else if (dy < 0) subir(); else descer();
    });
    alca.addEventListener('pointercancel', () => { y0 = null; });
    alca.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); subir(); } if (e.key === 'Escape') descer(); });
  })();
  $('busca').addEventListener('focus', () => { if (!ehDesktop() && painel.dataset.estado === 'baixo') estado('meio'); });

  // ---------- Distância ----------
  function distanciaM(a, b){
    const R = 6371000, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';
  const dist = h => (posicao && h.latitude != null && h.longitude != null) ? distanciaM(posicao, {lat:h.latitude, lng:h.longitude}) : null;

  // ---------- Lista ----------
  function visiveis(){
    const t = termo;
    return locais
      .filter(h => filtro === 'todas' || (h.categoria || 'outros') === filtro)
      .filter(h => !t || [h.nome, h.descricao, h.endereco, CATEGORIAS[h.categoria]].join(' ').toLowerCase().includes(t))
      .sort((a, b) => {
        const p = patrocinado(b) - patrocinado(a); if (p) return p;
        const da = dist(a), db = dist(b);
        if (da != null && db != null && da !== db) return da - db;
        return String(a.nome).localeCompare(String(b.nome), 'pt-BR');
      });
  }

  function pintarLista(){
    const itens = visiveis();
    $('contagem').textContent = itens.length + (itens.length === 1 ? ' local' : ' locais') + ' · deslize para ver';
    const el = $('lista');
    if (!itens.length){ el.innerHTML = '<div class="vazio">Nenhum local encontrado.</div>'; }
    else el.innerHTML = itens.map(h => {
      const d = dist(h);
      return '<button class="cartao" style="--cat:' + (COR[h.categoria] || COR.outros) + '" data-id="' + esc(h.id) + '" aria-label="Ver ' + esc(h.nome) + '">' +
        '<div class="foto">' + (urlSegura(h.foto_url) ? '<img src="' + esc(h.foto_url) + '" alt="" loading="lazy">' : (ICONES[h.categoria] || '📍')) + '</div>' +
        '<div style="min-width:0">' +
          (patrocinado(h) ? '<span class="tag">★ PATROCINADO</span>' : '') +
          '<h3>' + esc(h.nome) + '</h3>' +
          '<p>' + esc(CATEGORIAS[h.categoria] || 'Local') + (h.endereco ? ' · ' + esc(h.endereco) : '') + '</p>' +
          '<div class="info">' +
            (h.horario ? '<span>🕒 ' + esc(h.horario) + '</span>' : '') +
            (h.telefone ? '<span>📞 ' + esc(h.telefone) + '</span>' : '') +
            (d != null ? '<span>📍 ' + fmtDist(d) + '</span>' : '') +
            (h.n_aval ? '<span>★ ' + esc(h.nota_media) + '</span>' : '') +
          '</div>' +
        '</div></button>';
    }).join('');
    desenharPins(itens);
  }

  function pintarChips(){
    const usadas = [...new Set(locais.map(h => h.categoria || 'outros'))];
    $('chips').innerHTML = [['todas','Todas']].concat(usadas.map(c => [c, (ICONES[c] || '') + ' ' + (CATEGORIAS[c] || 'Outros')]))
      .map(([id, n]) => '<button class="chip' + (filtro === id ? ' on' : '') + '" data-c="' + esc(id) + '" aria-pressed="' + (filtro === id) + '">' + esc(n) + '</button>').join('');
  }

  // ---------- Mapa ----------
  function desenharPins(itens){
    camadaPins.clearLayers(); pinsPorId = {};
    itens.forEach(h => {
      if (h.latitude == null || h.longitude == null) return;
      const ic = L.divIcon({className:'', html:'<div class="pin' + (patrocinado(h) ? ' pat' : '') + (selecionado === h.id ? ' sel' : '') + '" style="--cat:' + (COR[h.categoria] || COR.outros) + '">' + (ICONES[h.categoria] || '📍') + '</div>', iconSize:[36,36], iconAnchor:[18,18]});
      const m = L.marker([h.latitude, h.longitude], {icon:ic, title:h.nome, keyboard:true, riseOnHover:true, zIndexOffset: patrocinado(h) ? 500 : 0});
      m.on('click', () => abrirDetalhe(h.id, true));
      m.addTo(camadaPins); pinsPorId[h.id] = m;
    });
  }

  function irPara(lat, lng, zoom){
    const z = Math.max(mapa.getZoom(), zoom || 16);
    let alvo = [lat, lng];
    if (!ehDesktop()){ // sobe o ponto para não ficar embaixo da lista
      const p = mapa.project(alvo, z); p.y += mapa.getSize().y * 0.22; alvo = mapa.unproject(p, z);
    }
    mapa.flyTo(alvo, z, {duration:.6});
  }

  // ---------- Detalhe ----------
  function abrirDetalhe(id, doMapa){
    const h = locais.find(x => String(x.id) === String(id)); if (!h) return;
    selecionado = h.id;
    const tel = digitos(h.telefone), zap = digitos(h.whatsapp || h.telefone);
    const temPos = h.latitude != null && h.longitude != null;
    const rota = temPos ? 'https://www.google.com/maps/dir/?api=1&destination=' + h.latitude + ',' + h.longitude : '';
    const link = location.origin + location.pathname + '#' + h.id;
    const msg = encodeURIComponent((h.nome || 'Local') + ' no Guia Lapa: ' + link);
    const d = dist(h);
    $('detalhe').innerHTML =
      '<div class="det">' +
      '<button class="voltar" id="voltar">← Voltar à lista</button>' +
      (urlSegura(h.foto_url) ? '<div class="capa-wrap"><img class="capa" src="' + esc(h.foto_url) + '" alt="Foto de ' + esc(h.nome) + '"></div>' : '') +
      (patrocinado(h) ? '<span class="tag">★ PATROCINADO</span>' : '') +
      '<h2>' + esc(h.nome) + '</h2>' +
      '<div class="linha"><span class="ic">' + (ICONES[h.categoria] || '📍') + '</span><span class="s">' + esc(CATEGORIAS[h.categoria] || 'Local') + (d != null ? ' · a ' + fmtDist(d) : '') + '</span></div>' +
      (h.horario ? '<div class="linha destaque"><span class="ic">🕒</span><span><b>Horário</b><br>' + esc(h.horario) + '</span></div>' : '') +
      (h.telefone ? '<div class="linha destaque"><span class="ic">📞</span><span><b>Telefone</b><br>' + esc(h.telefone) + '</span></div>' : '') +
      (h.endereco ? '<div class="linha"><span class="ic">📍</span><span>' + esc(h.endereco) + '</span></div>' : '') +
      (h.descricao ? '<p>' + esc(h.descricao) + '</p>' : '') +
      (h.n_aval ? '<div class="linha"><span class="ic">★</span><span>' + esc(h.nota_media) + ' (' + esc(h.n_aval) + ' avaliações no app)</span></div>' : '') +
      '<div class="btns">' +
        (rota ? '<a class="btn" href="' + esc(rota) + '" target="_blank" rel="noopener">Como chegar</a>' : '') +
        (tel ? '<a class="btn sec" href="tel:+' + comPais(tel) + '">Ligar</a>' : '') +
        (zap ? '<a class="btn sec" href="https://wa.me/' + comPais(zap) + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
        '<a class="btn sec" href="https://wa.me/?text=' + msg + '" target="_blank" rel="noopener">Compartilhar</a>' +
      '</div></div>';
    $('lista').hidden = true; $('avisos').hidden = true; $('anuncio').hidden = true; $('detalhe').hidden = false;
    $('rolagem').scrollTop = 0;
    $('voltar').addEventListener('click', fecharDetalhe);
    try { history.replaceState(null, '', '#' + h.id); } catch (_) {}
    if (!ehDesktop()) estado('alto');
    pintarLista(); // atualiza destaque do pino
    if (temPos) irPara(h.latitude, h.longitude, 17);
  }
  function fecharDetalhe(){
    selecionado = null;
    $('detalhe').hidden = true; $('lista').hidden = false; $('avisos').hidden = false; $('anuncio').hidden = false;
    try { history.replaceState(null, '', location.pathname); } catch (_) {}
    pintarLista();
  }

  // ---------- Avisos ----------
  const noAr = a => new Date(a.inicio || 0).getTime() <= Date.now() && new Date(a.ate || 0).getTime() > Date.now();
  function fmtQuando(a){
    const f = d => { const x = new Date(d); return x.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' ' + x.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); };
    return 'Até ' + f(a.ate);
  }
  function pintarAvisos(){
    camadaAvisos.clearLayers();
    const lista = (extras.avisos || []).filter(noAr);
    $('avisos').innerHTML = lista.map((a, i) => {
      const t = TIPOS[a.tipo] || TIPOS.aviso;
      return '<button class="aviso" data-i="' + i + '" style="--cor:' + t[2] + '"><span class="ic">' + t[0] + '</span><span><b>' + esc(a.titulo || t[1]) + '</b>' + esc(a.texto) + '<br><small>' + esc(fmtQuando(a)) + '</small></span></button>';
    }).join('');
    $('avisos').dataset.n = lista.length;
    lista.forEach((a, i) => {
      const t = TIPOS[a.tipo] || TIPOS.aviso;
      const pontos = [];
      if (Array.isArray(a.trajeto) && a.trajeto.length > 1){
        L.polyline(a.trajeto, {color:t[2], weight:7, opacity:.9}).addTo(camadaAvisos);
        pontos.push(a.trajeto[Math.floor(a.trajeto.length / 2)]);
      }
      (Array.isArray(a.marcadores) ? a.marcadores : []).forEach(p => pontos.push(p));
      pontos.forEach(p => {
        const ic = L.divIcon({className:'', html:'<div class="pin av" style="--cor:' + t[2] + '">' + t[0] + '</div>', iconSize:[36,36], iconAnchor:[18,18]});
        L.marker(p, {icon:ic, title:a.titulo || t[1], keyboard:true}).on('click', () => focarAviso(i)).addTo(camadaAvisos);
      });
    });
    $('avisos')._lista = lista;
  }
  function focarAviso(i){
    const a = ($('avisos')._lista || [])[i]; if (!a) return;
    const pts = (Array.isArray(a.trajeto) ? a.trajeto : []).concat(Array.isArray(a.marcadores) ? a.marcadores : []);
    if (pts.length) mapa.fitBounds(pts, {padding:[60, 60], maxZoom:17});
    if (!ehDesktop()) estado('baixo');
  }

  // ---------- Anúncios ----------
  function imagemDoAnuncio(a){
    return urlSegura(ehDesktop() ? (a.imagem_desktop_url || a.imagem_url) : a.imagem_url);
  }
  function pintarAnuncio(){
    clearInterval(anuncioTimer);
    const lista = (extras.anuncios || []).filter(a => imagemDoAnuncio(a));
    const box = $('anuncio');
    if (!lista.length){
      const zap = digitos(CFG.whatsappAdmin || (extras.config || {}).whatsapp_anuncios);
      box.innerHTML = zap ? '<div class="convite">Seu negócio aqui? <a href="https://wa.me/' + comPais(zap) + '?text=' + encodeURIComponent('Olá! Quero anunciar no Guia Lapa.') + '" target="_blank" rel="noopener">Fale com a gente</a></div>' : '';
      return;
    }
    const mostrar = () => {
      const a = lista[anuncioIdx % lista.length];
      const img = '<img src="' + esc(imagemDoAnuncio(a)) + '" alt="Anúncio: ' + esc(a.titulo) + '">';
      const link = urlSegura(a.link);
      box.innerHTML = '<div class="anuncio"><span class="rotulo">PATROCINADO</span>' +
        (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener sponsored" data-ad="' + esc(a.id) + '">' + img + '</a>' : '<div class="ad">' + img + '</div>') + '</div>';
      if (!anunciosVistos.has(a.id)){ anunciosVistos.add(a.id); rpc('app_anuncio_evento', {p_id:a.id, p_tipo:'visto'}).catch(() => {}); }
    };
    mostrar();
    if (lista.length > 1) anuncioTimer = setInterval(() => { anuncioIdx++; mostrar(); }, 7000);
  }
  $('anuncio').addEventListener('click', e => {
    const a = e.target.closest('a[data-ad]');
    if (a) rpc('app_anuncio_evento', {p_id:a.dataset.ad, p_tipo:'clique'}).catch(() => {});
  });

  // ---------- Eventos de interface ----------
  $('lista').addEventListener('click', e => { const b = e.target.closest('.cartao'); if (b) abrirDetalhe(b.dataset.id, false); });
  $('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; filtro = b.dataset.c; pintarChips(); pintarLista(); });
  $('busca').addEventListener('input', e => { termo = e.target.value.trim().toLowerCase(); if ($('detalhe').hidden === false) fecharDetalhe(); pintarLista(); });
  $('avisos').addEventListener('click', e => { const b = e.target.closest('.aviso'); if (b) focarAviso(+b.dataset.i); });
  window.addEventListener('resize', () => { if (mapa) mapa.invalidateSize(); pintarAnuncio(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('detalhe').hidden) fecharDetalhe(); });

  $('btn-perto').addEventListener('click', () => {
    if (!navigator.geolocation){ alert('Seu navegador não permite localização.'); return; }
    navigator.geolocation.getCurrentPosition(p => {
      posicao = {lat:p.coords.latitude, lng:p.coords.longitude};
      if (marcadorEu) marcadorEu.remove();
      marcadorEu = L.marker([posicao.lat, posicao.lng], {icon:L.divIcon({className:'', html:'<div class="eu"></div>', iconSize:[18,18], iconAnchor:[9,9]}), interactive:false}).addTo(mapa);
      pintarLista();
      mapa.flyTo([posicao.lat, posicao.lng], 16, {duration:.6});
    }, () => alert('Não foi possível pegar sua localização. Verifique a permissão do navegador.'), {enableHighAccuracy:true, timeout:10000});
  });

  // ---------- Início ----------
  mapa = L.map('mapa', {zoomControl:true}).setView([-13.2550, -43.4108], 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(mapa);
  camadaAvisos = L.layerGroup().addTo(mapa);
  camadaPins = L.layerGroup().addTo(mapa);

  const botoes = $('botoes-app');
  const apk = urlSegura(CFG.apkUrl);
  if (apk) botoes.innerHTML = '<a class="btn" href="' + esc(apk) + '" rel="noopener">Baixar para Android</a>';

  async function carregar(){
    if (!CFG.supabaseUrl || CFG.supabaseUrl.indexOf('SEU-PROJETO') >= 0){
      $('lista').innerHTML = '<div class="vazio">Site sem configuração. Preencha o config.js.</div>'; return;
    }
    try {
      const [h, ex] = await Promise.all([rpc('app_publico_hoteis'), rpc('app_publico_extras').catch(() => ({}))]);
      locais = Array.isArray(h.hoteis) ? h.hoteis : [];
      extras = {avisos: ex.avisos || [], anuncios: ex.anuncios || [], config: ex.config || {}};
      pintarChips(); pintarLista(); pintarAvisos(); pintarAnuncio();
      const pts = locais.filter(x => x.latitude != null && x.longitude != null).map(x => [x.latitude, x.longitude]);
      if (pts.length > 1) mapa.fitBounds(pts, {padding:[40, 40], maxZoom:16});
      const id = decodeURIComponent((location.hash || '').slice(1));
      if (id) abrirDetalhe(id, false);
    } catch (err) {
      $('lista').innerHTML = '<div class="vazio">Não foi possível carregar os locais agora. Tente de novo em instantes.</div>';
    }
  }
  carregar();
  // Atualiza avisos e anúncios a cada 5 minutos com a página aberta.
  setInterval(() => rpc('app_publico_extras').then(ex => { extras = {avisos: ex.avisos || [], anuncios: ex.anuncios || [], config: ex.config || {}}; pintarAvisos(); pintarAnuncio(); }).catch(() => {}), 300000);
})();
</script>
</body>
</html>
